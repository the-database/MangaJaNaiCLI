name: release

# MangaJaNaiCLI: the mangajanai command line and MangaJaNai GUI's upscaling backend (one program,
# two names). A v* tag matching Cargo.toml's version builds and publishes a Release with:
#   mangajanai-cli-windows-x64.zip   mangajanai_upscale.exe alone: MangaJaNaiConverterGui's package
#                                    builder downloads it from the release whose tag it pins
#   mangajanai-windows-x64.zip       mangajanai.exe + libaji + the VC++ runtime
#   mangajanai-linux-x64.tar.zst     mangajanai + libaji (TensorRT backend)
# `mangajanai setup` then downloads the GPU runtime (animejanai-inference's runtime-<n> release) and
# the models next to the program.
on:
  push:
    tags: ['v*']                   # tag a version -> build + publish a Release
  workflow_dispatch: {}            # manual run -> build the artifacts only

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml=$cargo_ver  tag=$tag_ver"
          [ "$cargo_ver" = "$tag_ver" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_ver — bump Cargo.toml"; exit 1; }

      # The libaji release both archives bundle: src/setup.rs's AJI_VERSION (which `mangajanai setup`
      # also fetches TensorRT-RTX from), so the pin lives in one place and bump_pins.py updates it.
      - name: Read the libaji pin
        shell: bash
        run: |
          v=$(sed -nE 's/^const AJI_VERSION: &str = "(v[0-9.]+)";.*/\1/p' src/setup.rs)
          [ -n "$v" ] || { echo "::error::no AJI_VERSION in src/setup.rs"; exit 1; }
          echo "AJI_VERSION=$v" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # AVIF input decoding needs dav1d (C), built static from source (the recipe yosh's release.yml
      # uses): MSVC env, nasm, meson + ninja, pkg-config, then dav1d with /MT to match the
      # +crt-static Rust build.
      - name: Set up MSVC env
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools found" }
          $oldPath = $env:Path -split ';'
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -notmatch '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { return }
            $name, $value = $Matches[1], $Matches[2]
            if ($name -eq 'Path') {
              $new = @($value -split ';' | Where-Object { $_ -and ($oldPath -notcontains $_) })
              [array]::Reverse($new)
              $new | Out-File $env:GITHUB_PATH -Append -Encoding utf8
            } elseif ([Environment]::GetEnvironmentVariable($name) -ne $value) {
              "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Install nasm
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install meson + ninja
        run: pip install -U meson ninja
      - name: dav1d env
        shell: bash
        run: |
          echo 'PKG_CONFIG=C:\build\bin\pkg-config.exe' >> "$GITHUB_ENV"
          echo 'PKG_CONFIG_PATH=C:\build\lib\pkgconfig' >> "$GITHUB_ENV"
          echo 'C:\build\bin' >> "$GITHUB_PATH"
          echo 'SYSTEM_DEPS_DAV1D_LINK=static' >> "$GITHUB_ENV"
      - name: Build pkg-config + dav1d static
        run: |
          git clone --branch meson-glib-subproject --depth 1 https://gitlab.freedesktop.org/tpm/pkg-config.git
          cd pkg-config
          meson setup build --prefix=C:\build --buildtype=release
          ninja -C build install
          cd ..
          git clone --branch 1.5.0 --depth 1 https://code.videolan.org/videolan/dav1d.git
          cd dav1d
          meson setup build --prefix=C:\build -Ddefault_library=static -Denable_tools=false -Denable_examples=false -Db_vscrt=mt --buildtype=release
          ninja -C build install

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release --features avif
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      # mangajanai-cli-windows-x64.zip: mangajanai_upscale.exe alone, as MangaJaNai GUI's builder expects.
      # mangajanai-windows-x64.zip: mangajanai.exe with libaji (AJI_VERSION) and the VC++ runtime its
      # DLLs link dynamically (app-local, as the redistributable terms allow), so `mangajanai setup`
      # only has to fetch the GPU runtime and the models.
      - name: Package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force package, package-trt, aji | Out-Null
          Copy-Item target/release/mangajanai_upscale.exe package/
          Compress-Archive -Path package/* -DestinationPath mangajanai-cli-windows-x64.zip -Force
          Copy-Item target/release/mangajanai.exe package-trt/
          gh release download $env:AJI_VERSION -R the-database/animejanai-inference -p aji-windows-x64.zip
          Expand-Archive aji-windows-x64.zip aji
          foreach ($f in 'aji.dll', 'aji_trt.dll', 'aji_dml.dll') { Copy-Item "aji/$f" package-trt/ }
          # aji_trtrtx.dll alone (its runtime comes from the pack store in `setup --store`, or with the
          # private trt-rtx component), from libaji releases that publish it separately
          gh release download $env:AJI_VERSION -R the-database/animejanai-inference -p aji-trtrtx-backend-windows-x64.zip
          if ($LASTEXITCODE -eq 0) {
            Expand-Archive aji-trtrtx-backend-windows-x64.zip aji -Force
            Copy-Item aji/aji_trtrtx.dll package-trt/
          } else {
            Write-Host "::warning::libaji $env:AJI_VERSION has no aji-trtrtx-backend-windows-x64.zip; setup --store installs no TensorRT-RTX"
            $global:LASTEXITCODE = 0
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Where-Object { $_.Parent.Parent.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          if (-not $crt) { throw "VC++ runtime (Microsoft.VC14x.CRT) not found under $vs" }
          Write-Host "VC++ runtime: $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" package-trt/
          Get-ChildItem package-trt | Format-Table Name, Length
          Compress-Archive -Path package-trt/* -DestinationPath mangajanai-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mangajanai-cli-windows-x64
          path: |
            mangajanai-cli-windows-x64.zip
            mangajanai-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mangajanai-cli-windows-x64.zip
            mangajanai-windows-x64.zip

  linux:
    # 22.04, not ubuntu-latest: the binary's glibc floor then matches libaji's Linux build
    # (ghcr.io/the-database/animejanai-linux-build:ubuntu2204). After the Windows job, so the two
    # never race to create the release.
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag_ver="${GITHUB_REF_NAME#v}"
          [ "$cargo_ver" = "$tag_ver" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_ver"; exit 1; }

      # The libaji release both archives bundle: src/setup.rs's AJI_VERSION (which `mangajanai setup`
      # also fetches TensorRT-RTX from), so the pin lives in one place and bump_pins.py updates it.
      - name: Read the libaji pin
        shell: bash
        run: |
          v=$(sed -nE 's/^const AJI_VERSION: &str = "(v[0-9.]+)";.*/\1/p' src/setup.rs)
          [ -n "$v" ] || { echo "::error::no AJI_VERSION in src/setup.rs"; exit 1; }
          echo "AJI_VERSION=$v" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # AVIF input decoding: dav1d built static (the recipe yosh's release.yml uses for Linux).
      - name: Install nasm, pkg-config
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config zstd
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install meson + ninja
        run: pip install -U meson ninja
      - name: Build dav1d static
        run: |
          git clone --branch 1.5.0 --depth 1 https://code.videolan.org/videolan/dav1d.git
          cd dav1d
          meson setup build --prefix="$HOME/dav1d_install" -Ddefault_library=static -Denable_tools=false -Denable_examples=false --buildtype=release
          ninja -C build install
          echo "PKG_CONFIG_PATH=$HOME/dav1d_install/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_DAV1D_LINK=static" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release --features avif

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stage aji
          gh release download "$AJI_VERSION" -R the-database/animejanai-inference -p aji-linux-x64.tar.zst
          tar --zstd -xf aji-linux-x64.tar.zst -C aji
          cp aji/libaji.so aji/libaji_trt.so stage/
          cp target/release/mangajanai stage/
          strip stage/mangajanai
          tar --zstd -C stage -cf mangajanai-linux-x64.tar.zst .
          tar --zstd -tvf mangajanai-linux-x64.tar.zst

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mangajanai-linux-x64
          path: mangajanai-linux-x64.tar.zst

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mangajanai-linux-x64.tar.zst

  # yosh and MangaJaNai GUI open PRs that pin the new release (their bump-pins.yml).
  notify-downstream:
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/notify-downstream.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
