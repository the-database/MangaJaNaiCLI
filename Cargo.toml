[package]
name = "mangajanai-cli"
version = "0.7.0"
edition = "2024"
description = "MangaJaNaiCLI: batch manga/image upscaling from the command line, and MangaJaNai GUI's upscaling backend, on yosh-image + libaji"
repository = "https://github.com/the-database/MangaJaNaiCLI"
license-file = "LICENSE"

[lib]
name = "mangajanai_cli"
path = "src/lib.rs"

# MangaJaNai GUI ships and runs this as mangajanai_upscale.exe: keep the name.
[[bin]]
name = "mangajanai_upscale"
path = "src/main.rs"

# The same program under its command-line name.
[[bin]]
name = "mangajanai"
path = "src/bin/mangajanai.rs"

[features]
# AVIF input decoding (dav1d, a C library: needs nasm + meson, as CI builds it). Release builds
# enable it; default builds stay free of it.
avif = ["yosh-image/avif"]
# JPEG XL output through libjxl (C++, built from source with CMake; on Windows also clang-cl, the
# Visual Studio component "C++ Clang tools for Windows", which the GitHub runners have). On by
# default; --no-default-features builds without it, and `--format jxl` then fails with a message.
jxl = ["dep:jpegxl-rs"]
default = ["jxl"]

[dependencies]
# yosh's imaging core (decoders, archives, resizing, the libaji bindings), pinned to a commit of
# the-database/yosh. Bump `rev` to take its changes; its decode/resize output is kept bit-identical.
yosh-image = { git = "https://github.com/the-database/yosh", rev = "cf2d3e27528247ff0c847f2c9916479e97d1d5d3", features = ["aji"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = "9"
# Encoders. libwebp (C, through the `webp` crate's bundled build) and libjxl (C++, the `jxl` feature)
# are the C dependencies; AVIF goes through ravif/rav1e without its assembly (no nasm needed).
png = "0.18"
jpeg-encoder = "0.7.1"
webp = "0.3.1"
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
jpegxl-rs = { version = "0.16.0", default-features = false, features = ["vendored"], optional = true }
# `mangajanai setup`: HTTPS downloads (ureq over rustls, as yosh's self-update), SHA-256 checks, the
# 7z packs (sevenz-rust2, the decoder yosh-image already uses) and NVML for GPU detection.
ureq = "3"
sha2 = "0.11"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util"] }
libloading = "0.9"
# The shared runtime pack store (setup --store): TensorRT, TensorRT-RTX and the models installed once
# per user and shared with the other apps. Pinned to a commit of the-database/aji-runtime.
aji-runtime = { git = "https://github.com/the-database/aji-runtime", rev = "e7a480309e60b8aad71b4625f633d58888628ade" }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = 3
# Whole-program LTO + one codegen unit, as yosh builds it: the hot path (decode, resize, encode)
# crosses crate boundaries. Not `panic = "abort"`: run.rs catches a panicking decoder or encoder
# so one bad file fails alone instead of the whole batch.
lto = "fat"
codegen-units = 1
